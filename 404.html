<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found</title>
  <style>
    :root { --bg: #0a0418; --fg: #f6f1ff; --pink: #ff2e88; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; text-align: center;
      background: var(--bg); color: var(--fg); font-family: Georgia, serif; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: 0 0 8px; }
    a { color: var(--pink); font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Wasted.</h1>
    <p>That page doesn't exist.</p>
    <p><a id="home" href="/">Back to the front page</a></p>
  </main>
  <script>
    // Project sites live under /<repo>/, so point home at that root.
    var seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg && location.hostname.endsWith("github.io")) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
