<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e0185a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Monoton&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Vice City Daily</title>
  <meta name="description" content="Vice City Daily — local news, nightlife, sports and weather from the neon coast.">
</head>
<body data-page="home">
  <div id="chrome-top"></div>
  <main>
    <div class="wrap">
      <div class="layout">
        <div>
          <div id="feed" aria-live="polite"></div>
          <section class="classifieds" id="classifieds"></section>
          <section class="newsletter">
            <h3>Get the Morning Edition</h3>
            <p>The day's top stories, the tide chart and your horoscope, in your inbox by 7 a.m.</p>
            <form id="newsletter-form">
              <label class="visually-hidden" for="email">Email address</label>
              <input id="email" type="email" placeholder="you@example.com" required>
              <button class="btn" type="submit">Subscribe</button>
            </form>
            <p class="msg" id="newsletter-msg" role="status"></p>
          </section>
        </div>
        <aside id="sidebar" aria-label="Daily features"></aside>
      </div>
    </div>
  </main>
  <div id="chrome-bottom"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
