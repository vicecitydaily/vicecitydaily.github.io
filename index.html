<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vice City Daily</title>
  <style>
    :root { --bg: #0d0221; --fg: #f5f5f5; --pink: #ff2a6d; --cyan: #05d9e8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #2a0845 60%, #6a0572 100%);
      color: var(--fg); text-align: center; padding: 16px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem); margin: 0;
      background: linear-gradient(90deg, var(--pink), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { opacity: .85; font-size: 1.1rem; }
    .badge {
      display: inline-block; margin-top: 1rem; padding: .4rem 1rem;
      border: 1px solid var(--cyan); border-radius: 999px; color: var(--cyan);
    }
  </style>
</head>
<body>
  <main>
    <h1>Vice City Daily</h1>
    <p>Test page hosted on GitHub Pages.</p>
    <span class="badge">It works 🌴</span>
    <p><small>Last deployed: <span id="ts"></span></small></p>
  </main>
  <script>document.getElementById('ts').textContent = document.lastModified;</script>
</body>
</html>
